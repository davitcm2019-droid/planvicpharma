<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Plano de Ação PGR — Vic Pharma</title>
<style>
:root{
  --b:#007EBF; --bd:#005a8a; --bl:#e6f2f9; --g:#2f9e62; --gl:#e3f4ea; --r:#c0362c; --rl:#fde7e5;
  --y:#f2a900; --yl:#fff6dd; --ink:#1d2b36; --mut:#667785; --line:#d7e4ec; --bg:#f4f8fb; --card:#fff;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.4 Arial,Helvetica,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
header{background:var(--b);color:#fff;padding:14px 22px;display:flex;align-items:center;gap:22px;flex-wrap:wrap}
header img{height:38px}
header .t{flex:1;min-width:260px;border-left:1px solid rgba(255,255,255,.45);padding-left:20px}
header h1{margin:0;font-size:21px}
header .s{font-size:12.5px;opacity:.9;margin-top:3px}
.kpis{display:flex;gap:10px;flex-wrap:wrap;padding:14px 22px 0}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px 16px;min-width:130px;cursor:pointer;transition:.15s}
.kpi:hover{border-color:var(--b)}
.kpi.on{outline:2px solid var(--b)}
.kpi b{display:block;font-size:26px}
.kpi span{font-size:12px;color:var(--mut)}
.kpi.k-fin b{color:var(--g)} .kpi.k-and b{color:var(--b)} .kpi.k-atr b{color:var(--r)} .kpi.k-prog b{color:var(--mut)}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:14px 22px}
.bar input[type=search],.bar select{border:1px solid var(--line);background:#fff;border-radius:6px;padding:7px 10px}
.bar input[type=search]{min-width:240px;flex:1;max-width:380px}
.sp{flex:1}
.btn{border:1px solid var(--line);background:#fff;border-radius:6px;padding:7px 12px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--b);color:var(--b)}
.btn.pri{background:var(--b);border-color:var(--b);color:#fff}
.btn.pri:hover{background:var(--bd);color:#fff}
.btn.dan{color:var(--r)} .btn.dan:hover{border-color:var(--r)}
.wrap{padding:0 22px 22px}
.tbl{background:var(--card);border:1px solid var(--line);border-radius:8px;overflow:auto}
table{border-collapse:collapse;width:100%;min-width:1500px;font-size:12.5px}
th{background:var(--bd);color:#fff;font-weight:600;padding:6px 4px;border:1px solid #fff;position:sticky;top:0;z-index:2}
th.yr{background:var(--b)}
th.mh{font-size:10.5px;padding:4px 0;min-width:30px}
th.cur{background:var(--y);color:var(--ink)}
td{border:1px solid var(--line);padding:5px 6px;vertical-align:middle}
tr.sec td{background:var(--bl);color:var(--bd);font-weight:700;text-transform:uppercase;letter-spacing:.6px;font-size:12px}
tr.row{cursor:pointer}
tr.row:hover td{background:#f7fbfe}
td.n{text-align:center;color:var(--mut);font-weight:700;width:34px}
td.a{font-weight:600;min-width:320px}
td.a small{display:block;font-weight:400;color:var(--mut);font-size:11px;margin-top:1px}
td.c{text-align:center;white-space:nowrap}
td.m{padding:0;height:30px;min-width:30px}
td.m.cur{background:var(--yl)}
td.m.on{background:var(--b)}
td.m.on.fin{background:var(--g)}
td.m.on.atr{background:var(--r)}
.tag{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:700}
.t-fin{background:var(--gl);color:var(--g)} .t-and{background:var(--bl);color:var(--bd)} .t-atr{background:var(--rl);color:var(--r)} .t-prog{background:#eef1f4;color:var(--mut)}
.p-crit{background:var(--rl);color:var(--r)} .p-aten{background:var(--yl);color:#8a5a00}
.pbar{width:62px;height:7px;background:#e5edf2;border-radius:4px;display:inline-block;vertical-align:middle;overflow:hidden;margin-right:5px}
.pbar i{display:block;height:100%;background:var(--b)}
.pbar i.f{background:var(--g)}
.imm{color:var(--r);font-weight:700;margin-left:4px}
.empty{padding:40px;text-align:center;color:var(--mut)}
.lg{display:flex;gap:18px;flex-wrap:wrap;font-size:12px;color:var(--mut);padding:10px 2px}
.lg i{display:inline-block;width:20px;height:10px;border-radius:2px;vertical-align:middle;margin-right:5px}
dialog{border:none;border-radius:10px;padding:0;width:min(760px,96vw);box-shadow:0 20px 60px rgba(0,0,0,.25)}
dialog::backdrop{background:rgba(10,30,45,.45)}
.dh{background:var(--b);color:#fff;padding:12px 18px;font-weight:700;font-size:16px}
.db{padding:16px 18px;display:grid;grid-template-columns:1fr 1fr;gap:12px}
.db label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--mut);font-weight:600}
.db input,.db select,.db textarea{border:1px solid var(--line);border-radius:6px;padding:7px 9px;color:var(--ink);font-weight:400;font-size:14px}
.db .full{grid-column:1/-1}
.per{display:flex;gap:8px;align-items:center;margin-bottom:6px}
.per input{flex:1}
.df{display:flex;gap:8px;padding:12px 18px;border-top:1px solid var(--line);background:#fafcfd}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:9px 16px;border-radius:6px;font-size:13px;opacity:0;transition:.25s;pointer-events:none}
.toast.on{opacity:1}
.save{font-size:12px;opacity:.9}
@media print{
  @page{size:A3 landscape;margin:8mm}
  body{background:#fff;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .bar,.noprint{display:none!important}
  .kpis{padding:8px 0 0}.kpi{padding:5px 12px;min-width:100px}.kpi b{font-size:18px}
  .wrap{padding:8px 0 0}.tbl{border:none;overflow:visible}
  table{min-width:0;font-size:10.5px} td.m{height:24px;min-width:0} th.mh{min-width:0}
  tr.row:hover td{background:none}
  header{border-radius:6px}
}
</style>
</head>

 - Crítica", "obs": ""}, {"id": 18, "tipo": "Ação", "nome": "Micro intervenções posturais nos postos de trabalho conforme AET (NR-17) com acompanhamento do RT em ergonomia", "imediata": false, "periodos": [{"ini": "2026-10", "fim": "2027-03"}], "pct": 0, "resp": "SESMT", "prio": "12 - De Atenção", "obs": ""}, {"id": 19, "tipo": "Ação", "nome": "Implantar ginástica laboral (mínimo 1x por semana)", "imediata": false, "periodos": [{"ini": "2026-11", "fim": "2027-02"}], "pct": 0, "resp": "SESMT", "prio": "12 - De Atenção", "obs": ""}, {"id": 20, "tipo": "Treinamento", "nome": "Treinamento de capacitação das lideranças (NR-01 / Lei 14.457/2022)", "imediata": false, "periodos": [{"ini": "2027-06", "fim": "2027-06"}], "pct": 0, "resp": "SESMT", "prio": "12 - De Atenção", "obs": ""}];
const MES = ['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
let state = {
  empresa: 'VIC PHARMA INDÚSTRIA E COMÉRCIO LTDA · Vic Pharma by Schülke',
  ini: '2025-09', fim: '2027-09',
  acoes: SEED.map(normalize),
  atualizado: null
};
let dirty = false, fileHandle = null, editing = null, kpiFilter = '';

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const today = new Date();
const curYM = `${today.getFullYear()}-${String(today.getMonth()+1).padStart(2,'0')}`;
const fmt = ym => { const [y,m] = ym.split('-'); return `${MES[+m-1]}/${y}`; };
function monthsBetween(a,b){ const out=[]; let [y,m]=a.split('-').map(Number); const [y2,m2]=b.split('-').map(Number);
  while(y<y2 || (y===y2 && m<=m2)){ out.push(`${y}-${String(m).padStart(2,'0')}`); m++; if(m>12){m=1;y++;} } return out; }
function nextYM(ym){ let [y,m]=ym.split('-').map(Number); m++; if(m>12){m=1;y++;} return `${y}-${String(m).padStart(2,'0')}`; }

function normalize(a){
  const per = (a.periodos||[]).filter(p=>p.ini).map(p=>({ini:p.ini, fim:(p.fim && p.fim>=p.ini)?p.fim:p.ini})).sort((x,y)=>x.ini.localeCompare(y.ini));
  const merged=[];
  for(const p of per){ const l=merged[merged.length-1]; if(l && p.ini<=nextYM(l.fim)){ if(p.fim>l.fim) l.fim=p.fim; } else merged.push({...p}); }
  return {id:a.id ?? Date.now()+Math.random(), tipo:a.tipo||'Ação', nome:a.nome||'', imediata:!!a.imediata, periodos:merged,
    pct:Math.max(0,Math.min(100,+a.pct||0)), resp:a.resp||'', prio:a.prio||'12 - De Atenção', obs:a.obs||''};
}
function status(a){
  if(a.pct>=100) return 'fin';
  const last = a.periodos.length ? a.periodos[a.periodos.length-1].fim : null;
  if(last && last < curYM) return 'atr';
  if(a.periodos.some(p=>p.ini<=curYM && curYM<=p.fim)) return 'and';
  return 'prog';
}
const STL = {fin:'Concluída', and:'Em andamento', atr:'Atrasada', prog:'Programada'};
const inMonth = (a,ym) => a.periodos.some(p=>p.ini<=ym && ym<=p.fim);
const prazoTxt = a => a.periodos.map(p=>p.ini===p.fim?fmt(p.ini):`${fmt(p.ini)} a ${fmt(p.fim)}`).join(' · ') || 'sem prazo';

function filtered(){
  const q=$('#q').value.trim().toLowerCase(), t=$('#fTipo').value, pr=$('#fPrio').value, r=$('#fResp').value;
  return state.acoes.filter(a=>(!q || (a.nome+' '+a.resp+' '+a.obs).toLowerCase().includes(q)) && (!t||a.tipo===t) && (!pr||a.prio===pr) && (!r||a.resp===r) && (!kpiFilter||status(a)===kpiFilter));
}

function render(){
  $('#sub').textContent = `${state.empresa} · Período: ${fmt(state.ini)} a ${fmt(state.fim)} · NR-01 (GRO/PGR)`;
  // filtros dinâmicos
  const fill=(sel,vals,label)=>{ const cur=sel.value; sel.innerHTML=`<option value="">${label}</option>`+[...new Set(vals)].filter(Boolean).sort().map(v=>`<option${v===cur?' selected':''}>${esc(v)}</option>`).join(''); };
  fill($('#fPrio'), state.acoes.map(a=>a.prio), 'Todas as prioridades');
  fill($('#fResp'), state.acoes.map(a=>a.resp), 'Todos os responsáveis');
  $('#respList').innerHTML=[...new Set(state.acoes.map(a=>a.resp))].map(v=>`<option value="${esc(v)}">`).join('');
  // KPIs
  const c={fin:0,and:0,atr:0,prog:0}; state.acoes.forEach(a=>c[status(a)]++);
  const media = state.acoes.length ? Math.round(state.acoes.reduce((s,a)=>s+a.pct,0)/state.acoes.length) : 0;
  const k=(cls,key,n,l)=>`<div class="kpi ${cls}${kpiFilter===key?' on':''}" data-k="${key}"><b>${n}</b><span>${l}</span></div>`;
  $('#kpis').innerHTML = k('', '', state.acoes.length,'ações no plano') + k('k-fin','fin',c.fin,'concluídas') + k('k-and','and',c.and,'em andamento')
    + k('k-prog','prog',c.prog,'programadas') + k('k-atr','atr',c.atr,'atrasadas') + `<div class="kpi" style="cursor:default"><b>${media}%</b><span>andamento médio</span></div>`;
  // tabela
  const months = monthsBetween(state.ini, state.fim);
  const years={}; months.forEach(m=>{const y=m.slice(0,4); years[y]=(years[y]||0)+1;});
  let h = `<thead><tr><th rowspan="2">Nº</th><th rowspan="2">Ação / prazo</th><th rowspan="2">Responsável</th><th rowspan="2">Prioridade</th><th rowspan="2">Andamento</th><th rowspan="2">Situação</th>`
    + Object.entries(years).map(([y,n])=>`<th class="yr" colspan="${n}">${y}</th>`).join('') + `</tr><tr>`
    + months.map(m=>`<th class="mh${m===curYM?' cur':''}">${MES[+m.slice(5)-1]}</th>`).join('') + `</tr></thead><tbody>`;
  const list = filtered(); let n=0;
  for(const tipo of ['Treinamento','Ação']){
    const items = list.filter(a=>a.tipo===tipo);
    if(!items.length) continue;
    h += `<tr class="sec"><td colspan="${6+months.length}">${tipo==='Ação'?'Ações':'Treinamentos'} (${items.length})</td></tr>`;
    for(const a of items){
      n++; const st=status(a);
      const pc = a.prio.includes('Crít') ? 'p-crit':'p-aten';
      h += `<tr class="row" data-id="${a.id}"><td class="n">${n}</td>
        <td class="a">${esc(a.nome)}${a.imediata?'<span class="imm" title="Imediata">●</span>':''}<small>${esc(prazoTxt(a))}</small></td>
        <td class="c">${esc(a.resp)}</td><td class="c"><span class="tag ${pc}">${esc(a.prio.split(' - ').pop())}</span></td>
        <td class="c"><span class="pbar"><i class="${a.pct>=100?'f':''}" style="width:${a.pct}%"></i></span>${a.pct}%</td>
        <td class="c"><span class="tag t-${st}">${STL[st]}</span></td>`
        + months.map(m=>`<td class="m${m===curYM?' cur':''}${inMonth(a,m)?' on '+st:''}"></td>`).join('') + `</tr>`;
    }
  }
  if(!n) h += `<tr><td colspan="${6+months.length}" class="empty">Nenhuma ação encontrada com esses filtros.</td></tr>`;
  $('#t').innerHTML = h + '</tbody>';
  $('#upd').textContent = state.atualizado ? `Última gravação: ${new Date(state.atualizado).toLocaleString('pt-BR')}` : '';
  $('#saveinfo').textContent = dirty ? '● Alterações não salvas' : (fileHandle ? `Arquivo: ${fileHandle.name}` : 'Plano carregado');
}

function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('on'); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('on'),2200); }
function touch(){ dirty=true; render(); }

// ---------- edição ----------
function perRow(p={ini:curYM,fim:curYM}){
  const d=document.createElement('div'); d.className='per';
  d.innerHTML=`<input type="month" class="pi" value="${p.ini}" required> → <input type="month" class="pf" value="${p.fim}" required><button type="button" class="btn dan">remover</button>`;
  d.querySelector('button').onclick=()=>d.remove(); return d;
}
function openEdit(a){
  editing = a ? a.id : null;
  const f=$('#frm');
  $('#dlgT').textContent = a ? 'Editar ação' : 'Nova ação';
  f.nome.value=a?.nome||''; f.tipo.value=a?.tipo||'Ação'; f.prio.value=a?.prio||'12 - De Atenção';
  f.resp.value=a?.resp||'SESMT'; f.imediata.value=a?.imediata?'1':'0'; f.pct.value=a?.pct||0; f.obs.value=a?.obs||'';
  $('#pctV').textContent=f.pct.value+'%';
  const box=$('#pers'); box.innerHTML=''; (a?.periodos?.length?a.periodos:[{ini:curYM,fim:curYM}]).forEach(p=>box.appendChild(perRow(p)));
  $('#bDel').style.display = a ? '' : 'none';
  $('#dlg').showModal();
}
$('#frm').pct.oninput = e => $('#pctV').textContent = e.target.value+'%';
$('#addPer').onclick = () => $('#pers').appendChild(perRow());
$('#bDone').onclick = () => { $('#frm').pct.value=100; $('#pctV').textContent='100%'; };
$('#bDel').onclick = () => {
  if(!confirm('Excluir esta ação do plano?')) return;
  state.acoes = state.acoes.filter(a=>a.id!==editing); $('#dlg').close('del'); touch(); toast('Ação excluída');
};
$('#dlg').addEventListener('close', () => {
  if($('#dlg').returnValue!=='ok') return;
  const f=$('#frm');
  const periodos=[...document.querySelectorAll('#pers .per')].map(d=>({ini:d.querySelector('.pi').value, fim:d.querySelector('.pf').value}));
  const data = normalize({id:editing ?? Date.now(), nome:f.nome.value.trim(), tipo:f.tipo.value, prio:f.prio.value, resp:f.resp.value.trim(),
    imediata:f.imediata.value==='1', pct:+f.pct.value, obs:f.obs.value.trim(), periodos});
  if(editing!=null) state.acoes = state.acoes.map(a=>a.id===editing?data:a); else state.acoes.push(data);
  touch(); toast('Ação salva no plano — lembre de "Salvar plano"');
});
$('#bNew').onclick = () => openEdit(null);
$('#t').onclick = e => { const tr=e.target.closest('tr.row'); if(tr) openEdit(state.acoes.find(a=>String(a.id)===tr.dataset.id)); };
$('#kpis').onclick = e => { const k=e.target.closest('.kpi[data-k]'); if(!k) return; kpiFilter = kpiFilter===k.dataset.k ? '' : k.dataset.k; render(); };
['#q','#fTipo','#fPrio','#fResp'].forEach(s=>$(s).addEventListener('input',render));

// ---------- configurar ----------
$('#bCfg').onclick = () => { const f=$('#cfgF'); f.empresa.value=state.empresa; f.ini.value=state.ini; f.fim.value=state.fim; $('#cfg').showModal(); };
$('#cfg').addEventListener('close', () => {
  if($('#cfg').returnValue!=='ok') return; const f=$('#cfgF');
  if(f.fim.value < f.ini.value){ toast('O fim do período deve ser depois do início'); return; }
  state.empresa=f.empresa.value; state.ini=f.ini.value; state.fim=f.fim.value; touch();
});

// ---------- arquivo ----------
function payload(){ state.atualizado=new Date().toISOString(); return JSON.stringify({app:'plano-acao-pgr',versao:1,...state},null,2); }
function load(obj){
  if(!obj || !Array.isArray(obj.acoes)) throw new Error('Arquivo não é um plano válido');
  state = {empresa:obj.empresa||state.empresa, ini:obj.ini||state.ini, fim:obj.fim||state.fim, acoes:obj.acoes.map(normalize), atualizado:obj.atualizado||null};
  dirty=false; render();
}
async function save(){
  const text=payload();
  try{
    if(window.showSaveFilePicker){
      if(!fileHandle) fileHandle = await showSaveFilePicker({suggestedName:'plano_acao_pgr_vicpharma.json', types:[{description:'Plano de ação',accept:{'application/json':['.json']}}]});
      const w=await fileHandle.createWritable(); await w.write(text); await w.close();
    } else download(text,'plano_acao_pgr_vicpharma.json','application/json');
    dirty=false; render(); toast('Plano salvo');
  }catch(e){ if(e.name!=='AbortError') { download(text,'plano_acao_pgr_vicpharma.json','application/json'); dirty=false; render(); toast('Plano baixado como arquivo'); } }
}
async function openPlan(){
  try{
    if(window.showOpenFilePicker){
      const [h]=await showOpenFilePicker({types:[{description:'Plano de ação',accept:{'application/json':['.json']}}]});
      load(JSON.parse(await (await h.getFile()).text())); fileHandle=h; render(); toast('Plano carregado');
    } else $('#file').click();
  }catch(e){ if(e.name!=='AbortError') toast('Não foi possível abrir: '+e.message); }
}
$('#file').onchange = async e => { const f=e.target.files[0]; if(!f) return; try{ load(JSON.parse(await f.text())); toast('Plano carregado'); }catch(err){ toast('Não foi possível abrir: '+err.message); } e.target.value=''; };
function download(text,name,type){ const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([text],{type})); a.download=name; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),1000); }
$('#bSave').onclick = save;
$("#bOpen").onclick = openPlan;
$('#bPrint').onclick = () => window.print();
$('#bCsv').onclick = () => {
  const q=v=>`"${String(v??'').replace(/"/g,'""')}"`;
  const rows=[['Tipo','Ação','Imediata?','Prazo','Andamento (%)','Situação','Responsável','Prioridade','Observações']]
    .concat(state.acoes.map(a=>[a.tipo,a.nome,a.imediata?'Sim':'Não',prazoTxt(a),a.pct,STL[status(a)],a.resp,a.prio,a.obs]));
  download('﻿'+rows.map(r=>r.map(q).join(';')).join('\r\n'),'plano_acao_pgr_vicpharma.csv','text/csv;charset=utf-8');
};
document.addEventListener('keydown', e => { if((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==='s'){ e.preventDefault(); save(); } });
window.addEventListener('beforeunload', e => { if(dirty){ e.preventDefault(); e.returnValue=''; } });
render();
</script>
</body>
</html>
